<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#09090b" />
  <title>PDF a Audio</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --bg: #09090b;
      --surface: #121215;
      --surface-hover: #1a1a1f;
      --border: #27272a;
      --text: #fafafa;
      --text-muted: #a1a1aa;
      --accent: #e4e4e7;
      --accent-text: #09090b;
      --highlight: rgba(255, 255, 255, 0.10);
      --badge-bg: rgba(16, 185, 129, 0.14);
      --badge-text: #34d399;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }

    header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: sticky;
      top: 0;
      background: rgba(9, 9, 11, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 20;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .engine-badge {
      font-size: 11px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--badge-bg);
      color: var(--badge-text);
      border: 1px solid rgba(52, 211, 153, 0.25);
    }

    .wake-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .wake-btn.active {
      border-color: var(--accent);
      color: var(--text);
      background: var(--surface);
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 20px 20px 190px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .dropzone {
      border: 1px dashed var(--border);
      background: var(--surface);
      border-radius: 14px;
      padding: 32px 20px;
      text-align: center;
      cursor: pointer;
    }

    .dropzone svg {
      width: 28px;
      height: 28px;
      stroke: var(--text-muted);
      margin-bottom: 10px;
    }

    .dropzone p {
      font-size: 14px;
      font-weight: 500;
    }

    .dropzone span {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    input[type="file"] {
      display: none;
    }

    .file-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 12px 14px;
      border-radius: 12px;
      gap: 12px;
    }

    .file-info {
      overflow: hidden;
    }

    .file-name {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-meta {
      font-size: 12px;
      color: var(--text-muted);
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
    }

    .settings-grid {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .field {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    select {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      width: 100%;
    }

    select option {
      background: var(--surface);
      color: var(--text);
    }

    .reader-box {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      max-height: 44dvh;
      overflow-y: auto;
      font-size: 15px;
      line-height: 1.7;
      color: #d4d4d8;
    }

    .sentence {
      padding: 3px 5px;
      border-radius: 5px;
      cursor: pointer;
      display: inline;
    }

    .sentence.active {
      background: var(--highlight);
      color: #ffffff;
      font-weight: 500;
    }

    .download-card {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      flex-direction: column;
      gap: 10px;
    }

    .download-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .download-title {
      font-size: 13px;
      font-weight: 500;
    }

    .download-sub {
      font-size: 12px;
      color: var(--text-muted);
    }

    .btn-secondary {
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      padding: 9px 14px;
      border-radius: 9px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-secondary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .status-msg {
      font-size: 12px;
      color: var(--text-muted);
      display: none;
    }

    .player-dock {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(18, 18, 21, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
      z-index: 30;
    }

    .player-inner {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .progress-bar {
      flex: 1;
      height: 4px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.2s ease;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .page-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .play-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: var(--accent-text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .speed-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      padding: 7px 11px;
      border-radius: 8px;
      cursor: pointer;
      min-width: 54px;
    }
  </style>
</head>
<body>

  <header>
    <div class="title-group">
      <h1>PDF a Audio</h1>
      <span class="engine-badge" id="engineBadge">Voz Lista</span>
    </div>
    <button class="wake-btn" id="wakeBtn">
      <span id="wakeDot">○</span> Pantalla activa
    </button>
  </header>

  <main>
    <label class="dropzone" id="dropzone" for="pdfInput">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <path d="M12 18v-6"/>
        <path d="m9 15 3-3 3 3"/>
      </svg>
      <p>Seleccionar archivo PDF</p>
      <span>Toca para elegir desde Archivos o iCloud</span>
      <input type="file" id="pdfInput" accept="application/pdf,.pdf" />
    </label>

    <div class="file-bar" id="fileBar">
      <div class="file-info">
        <div class="file-name" id="fileName">documento.pdf</div>
        <div class="file-meta" id="fileMeta">0 páginas</div>
      </div>
      <label class="btn-ghost" for="pdfInput">Cambiar</label>
    </div>

    <div class="settings-grid" id="settingsGrid">
      <div class="field">
        <label for="voiceSelect">Motor de Voz</label>
        <select id="voiceSelect"></select>
      </div>
      <div class="field">
        <label for="pageSelect">Ir a página</label>
        <select id="pageSelect"></select>
      </div>
    </div>

    <div class="reader-box" id="readerBox"></div>

    <div class="download-card" id="downloadCard">
      <div class="download-row">
        <div>
          <div class="download-title">Descargar audio con voz (.MP3)</div>
          <div class="download-sub">Genera pista de voz real lista para guardar en iPhone</div>
        </div>
        <div style="display:flex; gap:8px; align-items:center;">
          <select id="exportScope" style="border:1px solid var(--border); padding:8px 10px; border-radius:8px; background:var(--bg); font-size:12px;">
            <option value="page">Página actual</option>
            <option value="all">Todo el PDF</option>
          </select>
          <button class="btn-secondary" id="downloadBtn">Descargar .MP3</button>
        </div>
      </div>
      <div class="status-msg" id="exportStatus"></div>
    </div>
  </main>

  <div class="player-dock" id="playerDock">
    <div class="player-inner">
      <div class="progress-row">
        <span id="sentenceCounter">0 / 0</span>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span id="pageIndicator">Pág. 1</span>
      </div>

      <div class="controls-row">
        <div class="page-nav">
          <button class="icon-btn" id="prevPageBtn" title="Página anterior">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
          </button>
          <button class="icon-btn" id="nextPageBtn" title="Página siguiente">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </button>
        </div>

        <button class="play-btn" id="playPauseBtn" title="Reproducir / Pausar">
          <svg id="playIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="6 3 20 12 6 21 6 3"/>
          </svg>
          <svg id="pauseIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
            <rect x="6" y="4" width="4" height="16"/>
            <rect x="14" y="4" width="4" height="16"/>
          </svg>
        </button>

        <button class="speed-btn" id="speedBtn">1.0x</button>
      </div>
    </div>
  </div>

  <!-- Reproductor HTML5 persistente para desbloquear audio en iOS Safari -->
  <audio id="streamAudio" playsinline preload="auto"></audio>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const pdfInput = document.getElementById('pdfInput');
    const dropzone = document.getElementById('dropzone');
    const fileBar = document.getElementById('fileBar');
    const fileNameEl = document.getElementById('fileName');
    const fileMetaEl = document.getElementById('fileMeta');
    const settingsGrid = document.getElementById('settingsGrid');
    const voiceSelect = document.getElementById('voiceSelect');
    const pageSelect = document.getElementById('pageSelect');
    const readerBox = document.getElementById('readerBox');
    const playerDock = document.getElementById('playerDock');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const prevPageBtn = document.getElementById('prevPageBtn');
    const nextPageBtn = document.getElementById('nextPageBtn');
    const speedBtn = document.getElementById('speedBtn');
    const sentenceCounter = document.getElementById('sentenceCounter');
    const pageIndicator = document.getElementById('pageIndicator');
    const progressFill = document.getElementById('progressFill');
    const wakeBtn = document.getElementById('wakeBtn');
    const wakeDot = document.getElementById('wakeDot');
    const downloadCard = document.getElementById('downloadCard');
    const downloadBtn = document.getElementById('downloadBtn');
    const exportScope = document.getElementById('exportScope');
    const exportStatus = document.getElementById('exportStatus');
    const engineBadge = document.getElementById('engineBadge');
    const streamAudio = document.getElementById('streamAudio');

    let pdfDoc = null;
    let pagesText = [];
    let currentPage = 1;
    let sentences = [];
    let currentSentenceIdx = 0;
    let isPlaying = false;
    let isPaused = false;
    let playbackRate = 1.0;
    const speeds = [1.0, 1.25, 1.5, 1.75, 2.0, 0.85];
    let speedIdx = 0;
    let nativeVoices = [];
    let wakeLock = null;
    let currentPdfName = 'documento';
    let watchdogTimer = null;

    function populateVoices() {
      const prevVal = voiceSelect.value;
      voiceSelect.innerHTML = '';

      // Opción 1: Voz Stream Universal (funciona 100% en iPhone Safari y bloqueos de WebView)
      const optStreamEs = document.createElement('option');
      optStreamEs.value = 'stream:es';
      optStreamEs.textContent = 'Voz Español Natural (Universal iOS)';
      voiceSelect.appendChild(optStreamEs);

      const optStreamEn = document.createElement('option');
      optStreamEn.value = 'stream:en';
      optStreamEn.textContent = 'Voz Inglés Natural (Universal iOS)';
      voiceSelect.appendChild(optStreamEn);

      // Opciones nativas de Apple si están disponibles
      if ('speechSynthesis' in window) {
        try {
          const list = window.speechSynthesis.getVoices();
          if (list && list.length > 0) {
            const esVoices = list.filter(v => v.lang.toLowerCase().startsWith('es'));
            const otherVoices = list.filter(v => !v.lang.toLowerCase().startsWith('es'));
            nativeVoices = [...esVoices, ...otherVoices];

            nativeVoices.forEach((v, i) => {
              const opt = document.createElement('option');
              opt.value = 'native:' + i;
              opt.textContent = `iOS: ${v.name} (${v.lang})`;
              voiceSelect.appendChild(opt);
            });
          }
        } catch (e) {}
      }

      if (prevVal) voiceSelect.value = prevVal;
    }

    populateVoices();
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = populateVoices;
    }

    wakeBtn.addEventListener('click', async () => {
      if (!('wakeLock' in navigator)) return;
      try {
        if (wakeLock) {
          await wakeLock.release();
          wakeLock = null;
          wakeBtn.classList.remove('active');
          wakeDot.textContent = '○';
        } else {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeBtn.classList.add('active');
          wakeDot.textContent = '●';
        }
      } catch (e) {}
    });

    pdfInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      stopAllAudio();
      currentPdfName = file.name.replace(/\.pdf$/i, '');
      fileNameEl.textContent = file.name;
      fileMetaEl.textContent = 'Extrayendo texto...';
      dropzone.style.display = 'none';
      fileBar.style.display = 'flex';

      try {
        const arrayBuffer = await file.arrayBuffer();
        pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        const total = pdfDoc.numPages;
        fileMetaEl.textContent = `${total} ${total === 1 ? 'página' : 'páginas'}`;

        pagesText = [];
        pageSelect.innerHTML = '';

        for (let p = 1; p <= total; p++) {
          const page = await pdfDoc.getPage(p);
          const content = await page.getTextContent();
          const rawText = content.items.map(item => item.str).join(' ');
          const cleanText = rawText.replace(/\s+/g, ' ').trim();
          pagesText.push(cleanText);

          const opt = document.createElement('option');
          opt.value = p;
          opt.textContent = `Página ${p}`;
          pageSelect.appendChild(opt);
        }

        settingsGrid.style.display = 'grid';
        readerBox.style.display = 'block';
        downloadCard.style.display = 'flex';
        playerDock.style.display = 'block';

        loadPage(1, false);
      } catch (err) {
        fileMetaEl.textContent = 'Error al leer el PDF';
      }
    });

    // Divide en fragmentos cortos (<180 caracteres) para que iOS nunca trabe el TTS
    function splitTextSafely(text) {
      if (!text) return ['Página sin texto seleccionable.'];
      const rawSentences = text.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [text];
      const chunks = [];

      rawSentences.forEach(s => {
        const clean = s.trim();
        if (!clean) return;
        if (clean.length <= 170) {
          chunks.push(clean);
        } else {
          const words = clean.split(' ');
          let buf = '';
          words.forEach(w => {
            if ((buf + ' ' + w).trim().length > 165) {
              if (buf) chunks.push(buf.trim());
              buf = w;
            } else {
              buf = (buf + ' ' + w).trim();
            }
          });
          if (buf) chunks.push(buf.trim());
        }
      });

      return chunks.length > 0 ? chunks : ['Página sin texto seleccionable.'];
    }

    function loadPage(pageNum, autoPlay = false) {
      stopAllAudio();
      currentPage = pageNum;
      pageSelect.value = pageNum;
      pageIndicator.textContent = `Pág. ${pageNum}/${pagesText.length}`;

      sentences = splitTextSafely(pagesText[pageNum - 1]);
      currentSentenceIdx = 0;

      readerBox.innerHTML = '';
      sentences.forEach((sentence, idx) => {
        const span = document.createElement('span');
        span.className = 'sentence';
        span.textContent = sentence + ' ';
        span.dataset.idx = idx;
        span.addEventListener('click', () => {
          stopAllAudio();
          currentSentenceIdx = idx;
          startPlayback();
        });
        readerBox.appendChild(span);
      });

      updateProgressUI();
      if (autoPlay) startPlayback();
    }

    function updateProgressUI() {
      const total = sentences.length;
      sentenceCounter.textContent = `${Math.min(currentSentenceIdx + 1, total)} / ${total}`;
      const pct = total > 0 ? (currentSentenceIdx / total) * 100 : 0;
      progressFill.style.width = `${pct}%`;

      document.querySelectorAll('.sentence').forEach((el, idx) => {
        if (idx === currentSentenceIdx) {
          el.classList.add('active');
          el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } else {
          el.classList.remove('active');
        }
      });
    }

    function buildStreamUrl(text, lang) {
      const encoded = encodeURIComponent(text.slice(0, 190));
      return `https://translate.google.com/translate_tts?ie=UTF-8&tl=${lang}&client=tw-ob&q=${encoded}`;
    }

    function playStreamChunk(text, lang, idx) {
      const url = buildStreamUrl(text, lang);
      streamAudio.src = url;
      streamAudio.playbackRate = playbackRate;

      streamAudio.onended = () => {
        if (isPlaying && !isPaused) {
          speakChunk(idx + 1);
        }
      };

      streamAudio.onerror = () => {
        // Si falla la red en una frase, intenta con speechSynthesis nativo sin quedarse pegado
        tryNativeFallback(text, idx);
      };

      const playPromise = streamAudio.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {
          tryNativeFallback(text, idx);
        });
      }
    }

    function tryNativeFallback(text, idx) {
      if (!('speechSynthesis' in window)) {
        if (isPlaying && !isPaused) speakChunk(idx + 1);
        return;
      }
      const u = new SpeechSynthesisUtterance(text);
      u.lang = voiceSelect.value.includes('en') ? 'en-US' : 'es-ES';
      u.rate = playbackRate;
      u.onend = () => { if (isPlaying && !isPaused) speakChunk(idx + 1); };
      u.onerror = () => { if (isPlaying && !isPaused) speakChunk(idx + 1); };
      window.speechSynthesis.speak(u);
    }

    function speakChunk(idx) {
      clearTimeout(watchdogTimer);

      if (idx >= sentences.length) {
        if (currentPage < pagesText.length) {
          loadPage(currentPage + 1, true);
        } else {
          stopAllAudio();
          progressFill.style.width = '100%';
        }
        return;
      }

      currentSentenceIdx = idx;
      updateProgressUI();

      const text = sentences[idx];
      const mode = voiceSelect.value || 'stream:es';

      if (mode.startsWith('native:') && ('speechSynthesis' in window)) {
        // NO llamar cancel() en el primer toque para evitar bloqueo de Safari iOS
        if (window.speechSynthesis.speaking) {
          window.speechSynthesis.cancel();
        }
        const u = new SpeechSynthesisUtterance(text);
        const vIdx = parseInt(mode.split(':')[1], 10);
        if (nativeVoices[vIdx]) {
          u.voice = nativeVoices[vIdx];
          u.lang = nativeVoices[vIdx].lang;
        } else {
          u.lang = 'es-ES';
        }
        u.rate = playbackRate;

        let started = false;
        watchdogTimer = setTimeout(() => {
          if (!started && isPlaying && !isPaused) {
            // Safari dejó pegado speechSynthesis: saltar automáticamente a voz stream
            voiceSelect.value = 'stream:es';
            engineBadge.textContent = 'Voz Stream Activa';
            playStreamChunk(text, 'es', idx);
          }
        }, 1100);

        u.onstart = () => {
          started = true;
          clearTimeout(watchdogTimer);
        };
        u.onend = () => {
          clearTimeout(watchdogTimer);
          if (isPlaying && !isPaused) speakChunk(idx + 1);
        };
        u.onerror = () => {
          clearTimeout(watchdogTimer);
          if (isPlaying && !isPaused) {
            voiceSelect.value = 'stream:es';
            playStreamChunk(text, 'es', idx);
          }
        };

        window.speechSynthesis.speak(u);
      } else {
        const lang = mode === 'stream:en' ? 'en' : 'es';
        playStreamChunk(text, lang, idx);
      }
    }

    function startPlayback() {
      isPlaying = true;
      isPaused = false;
      updatePlayButtonUI();
      speakChunk(currentSentenceIdx);
    }

    function pausePlayback() {
      isPaused = true;
      clearTimeout(watchdogTimer);
      streamAudio.pause();
      if ('speechSynthesis' in window) {
        try { window.speechSynthesis.cancel(); } catch (e) {}
      }
      updatePlayButtonUI();
    }

    function stopAllAudio() {
      isPlaying = false;
      isPaused = false;
      clearTimeout(watchdogTimer);
      streamAudio.pause();
      streamAudio.removeAttribute('src');
      if ('speechSynthesis' in window) {
        try { window.speechSynthesis.cancel(); } catch (e) {}
      }
      updatePlayButtonUI();
    }

    function updatePlayButtonUI() {
      if (isPlaying && !isPaused) {
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
      } else {
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
      }
    }

    // Gesto directo del usuario: desbloquea el elemento <audio> en iOS inmediatamente
    playPauseBtn.addEventListener('click', () => {
      if (!pdfDoc) return;
      if (!isPlaying || isPaused) {
        startPlayback();
      } else {
        pausePlayback();
      }
    });

    prevPageBtn.addEventListener('click', () => {
      if (currentPage > 1) loadPage(currentPage - 1, isPlaying && !isPaused);
    });

    nextPageBtn.addEventListener('click', () => {
      if (currentPage < pagesText.length) loadPage(currentPage + 1, isPlaying && !isPaused);
    });

    pageSelect.addEventListener('change', (e) => {
      loadPage(parseInt(e.target.value, 10), isPlaying && !isPaused);
    });

    speedBtn.addEventListener('click', () => {
      speedIdx = (speedIdx + 1) % speeds.length;
      playbackRate = speeds[speedIdx];
      speedBtn.textContent = `${playbackRate}x`;
      streamAudio.playbackRate = playbackRate;
      if (isPlaying && !isPaused && voiceSelect.value.startsWith('native:')) {
        speakChunk(currentSentenceIdx);
      }
    });

    // Descarga directa de pista .MP3 con voz real
    downloadBtn.addEventListener('click', async () => {
      if (!pdfDoc) return;
      downloadBtn.disabled = true;
      exportStatus.style.display = 'block';
      exportStatus.textContent = 'Generando audio .MP3 con voz...';

      try {
        const rawText = exportScope.value === 'all'
          ? pagesText.join('. ')
          : (pagesText[currentPage - 1] || '');

        const chunks = splitTextSafely(rawText).slice(0, 45);
        const lang = voiceSelect.value === 'stream:en' ? 'en' : 'es';
        const buffers = [];

        for (let i = 0; i < chunks.length; i++) {
          exportStatus.textContent = `Procesando fragmento ${i + 1} de ${chunks.length}...`;
          const res = await fetch(buildStreamUrl(chunks[i], lang));
          if (res.ok) {
            const buf = await res.arrayBuffer();
            buffers.push(buf);
          }
        }

        if (buffers.length === 0) {
          throw new Error('No se pudo obtener el audio.');
        }

        const mp3Blob = new Blob(buffers, { type: 'audio/mpeg' });
        const url = URL.createObjectURL(mp3Blob);
        const a = document.createElement('a');
        const suffix = exportScope.value === 'all' ? 'completo' : `pag-${currentPage}`;
        a.href = url;
        a.download = `${currentPdfName}-${suffix}.mp3`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 5000);

        exportStatus.textContent = 'Audio .MP3 descargado correctamente.';
      } catch (err) {
        exportStatus.textContent = 'No se pudo descargar el MP3 en este entorno.';
      } finally {
        downloadBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
