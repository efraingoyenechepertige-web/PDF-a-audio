<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#09090b" />
  <title>PDF a Audio</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --bg: #09090b;
      --surface: #121215;
      --surface-hover: #1a1a1f;
      --border: #27272a;
      --text: #fafafa;
      --text-muted: #a1a1aa;
      --accent: #e4e4e7;
      --accent-text: #09090b;
      --highlight: rgba(255, 255, 255, 0.08);
      --badge-bg: rgba(16, 185, 129, 0.14);
      --badge-text: #34d399;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }

    header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: sticky;
      top: 0;
      background: rgba(9, 9, 11, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 20;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .engine-badge {
      font-size: 11px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--badge-bg);
      color: var(--badge-text);
      border: 1px solid rgba(52, 211, 153, 0.25);
    }

    .wake-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .wake-btn.active {
      border-color: var(--accent);
      color: var(--text);
      background: var(--surface);
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 20px 20px 180px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .dropzone {
      border: 1px dashed var(--border);
      background: var(--surface);
      border-radius: 14px;
      padding: 32px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .dropzone:hover, .dropzone:active {
      border-color: var(--text-muted);
      background: var(--surface-hover);
    }

    .dropzone svg {
      width: 28px;
      height: 28px;
      stroke: var(--text-muted);
      margin-bottom: 10px;
    }

    .dropzone p {
      font-size: 14px;
      font-weight: 500;
    }

    .dropzone span {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    input[type="file"] {
      display: none;
    }

    .file-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 12px 14px;
      border-radius: 12px;
      gap: 12px;
    }

    .file-info {
      overflow: hidden;
    }

    .file-name {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-meta {
      font-size: 12px;
      color: var(--text-muted);
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
    }

    .settings-grid {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .field {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    select {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      width: 100%;
    }

    select option {
      background: var(--surface);
      color: var(--text);
    }

    .reader-box {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      max-height: 44dvh;
      overflow-y: auto;
      font-size: 15px;
      line-height: 1.7;
      color: #d4d4d8;
    }

    .sentence {
      padding: 2px 4px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .sentence:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .sentence.active {
      background: var(--highlight);
      color: #ffffff;
      font-weight: 500;
    }

    .download-card {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      flex-direction: column;
      gap: 10px;
    }

    .download-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .download-title {
      font-size: 13px;
      font-weight: 500;
    }

    .download-sub {
      font-size: 12px;
      color: var(--text-muted);
    }

    .btn-secondary {
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      padding: 9px 14px;
      border-radius: 9px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.15s;
    }

    .btn-secondary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .status-msg {
      font-size: 12px;
      color: var(--text-muted);
      display: none;
    }

    .player-dock {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(18, 18, 21, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
      z-index: 30;
    }

    .player-inner {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .progress-bar {
      flex: 1;
      height: 4px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.2s ease;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .page-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    .play-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: var(--accent-text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .play-btn:active {
      transform: scale(0.95);
    }

    .speed-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      min-width: 52px;
    }
  </style>
</head>
<body>

  <header>
    <div class="title-group">
      <h1>PDF a Audio</h1>
      <span class="engine-badge" id="engineBadge">Motor Híbrido Listo</span>
    </div>
    <button class="wake-btn" id="wakeBtn" title="Evitar que se apague la pantalla">
      <span id="wakeDot">○</span> Pantalla activa
    </button>
  </header>

  <main>
    <label class="dropzone" id="dropzone" for="pdfInput">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <path d="M12 18v-6"/>
        <path d="m9 15 3-3 3 3"/>
      </svg>
      <p>Seleccionar archivo PDF</p>
      <span>Toca para elegir desde Archivos o iCloud</span>
      <input type="file" id="pdfInput" accept="application/pdf,.pdf" />
    </label>

    <div class="file-bar" id="fileBar">
      <div class="file-info">
        <div class="file-name" id="fileName">documento.pdf</div>
        <div class="file-meta" id="fileMeta">0 páginas</div>
      </div>
      <label class="btn-ghost" for="pdfInput">Cambiar</label>
    </div>

    <div class="settings-grid" id="settingsGrid">
      <div class="field">
        <label for="voiceSelect">Voz / Motor</label>
        <select id="voiceSelect"></select>
      </div>
      <div class="field">
        <label for="pageSelect">Ir a página</label>
        <select id="pageSelect"></select>
      </div>
    </div>

    <div class="reader-box" id="readerBox"></div>

    <div class="download-card" id="downloadCard">
      <div class="download-row">
        <div>
          <div class="download-title">Exportar audio descargable</div>
          <div class="download-sub">Genera un archivo .WAV compatible con iPhone</div>
        </div>
        <div style="display:flex; gap:8px; align-items:center;">
          <select id="exportScope" style="border:1px solid var(--border); padding:8px 10px; border-radius:8px; background:var(--bg); font-size:12px;">
            <option value="page">Página actual</option>
            <option value="all">Todo el PDF</option>
          </select>
          <button class="btn-secondary" id="downloadBtn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            Descargar .WAV
          </button>
        </div>
      </div>
      <div class="status-msg" id="exportStatus"></div>
    </div>
  </main>

  <div class="player-dock" id="playerDock">
    <div class="player-inner">
      <div class="progress-row">
        <span id="sentenceCounter">0 / 0</span>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span id="pageIndicator">Pág. 1</span>
      </div>

      <div class="controls-row">
        <div class="page-nav">
          <button class="icon-btn" id="prevPageBtn" title="Página anterior">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
          </button>
          <button class="icon-btn" id="nextPageBtn" title="Página siguiente">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </button>
        </div>

        <button class="play-btn" id="playPauseBtn" title="Reproducir / Pausar">
          <svg id="playIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="6 3 20 12 6 21 6 3"/>
          </svg>
          <svg id="pauseIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
            <rect x="6" y="4" width="4" height="16"/>
            <rect x="14" y="4" width="4" height="16"/>
          </svg>
        </button>

        <button class="speed-btn" id="speedBtn">1.0x</button>
      </div>
    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const pdfInput = document.getElementById('pdfInput');
    const dropzone = document.getElementById('dropzone');
    const fileBar = document.getElementById('fileBar');
    const fileNameEl = document.getElementById('fileName');
    const fileMetaEl = document.getElementById('fileMeta');
    const settingsGrid = document.getElementById('settingsGrid');
    const voiceSelect = document.getElementById('voiceSelect');
    const pageSelect = document.getElementById('pageSelect');
    const readerBox = document.getElementById('readerBox');
    const playerDock = document.getElementById('playerDock');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const prevPageBtn = document.getElementById('prevPageBtn');
    const nextPageBtn = document.getElementById('nextPageBtn');
    const speedBtn = document.getElementById('speedBtn');
    const sentenceCounter = document.getElementById('sentenceCounter');
    const pageIndicator = document.getElementById('pageIndicator');
    const progressFill = document.getElementById('progressFill');
    const wakeBtn = document.getElementById('wakeBtn');
    const wakeDot = document.getElementById('wakeDot');
    const downloadCard = document.getElementById('downloadCard');
    const downloadBtn = document.getElementById('downloadBtn');
    const exportScope = document.getElementById('exportScope');
    const exportStatus = document.getElementById('exportStatus');
    const engineBadge = document.getElementById('engineBadge');

    let pdfDoc = null;
    let pagesText = [];
    let currentPage = 1;
    let sentences = [];
    let currentSentenceIdx = 0;
    let isPlaying = false;
    let isPaused = false;
    let playbackRate = 1.0;
    const speeds = [1.0, 1.25, 1.5, 1.75, 2.0, 0.85];
    let speedIdx = 0;
    let nativeVoices = [];
    let hasNativeSpeech = false;
    let wakeLock = null;
    let currentPdfName = 'documento';

    let jsAudioCtx = null;
    let jsPlaybackTimer = null;
    let jsActiveNodes = [];

    // Detectar soporte de síntesis nativa vs motor JS integrado
    function detectSpeechEngine() {
      const supported = ('speechSynthesis' in window) && (typeof SpeechSynthesisUtterance !== 'undefined');
      if (supported) {
        try {
          const list = window.speechSynthesis.getVoices();
          hasNativeSpeech = true;
          populateVoices(list);
        } catch (e) {
          hasNativeSpeech = false;
          populateVoices([]);
        }
      } else {
        hasNativeSpeech = false;
        populateVoices([]);
      }
    }

    function populateVoices(list) {
      voiceSelect.innerHTML = '';
      if (hasNativeSpeech && list && list.length > 0) {
        engineBadge.textContent = 'Voz Nativa iOS';
        const esVoices = list.filter(v => v.lang.toLowerCase().startsWith('es'));
        const otherVoices = list.filter(v => !v.lang.toLowerCase().startsWith('es'));
        nativeVoices = [...esVoices, ...otherVoices];

        nativeVoices.forEach((voice, i) => {
          const opt = document.createElement('option');
          opt.value = 'native:' + i;
          opt.textContent = `${voice.name} (${voice.lang})`;
          voiceSelect.appendChild(opt);
        });
      } else {
        engineBadge.textContent = 'Motor JS Integrado';
      }

      // Siempre incluir opciones del motor JS integrado como respaldo universal
      const jsOpt1 = document.createElement('option');
      jsOpt1.value = 'js:grave';
      jsOpt1.textContent = 'Motor JS — Voz Grave (Universal)';
      voiceSelect.appendChild(jsOpt1);

      const jsOpt2 = document.createElement('option');
      jsOpt2.value = 'js:clara';
      jsOpt2.textContent = 'Motor JS — Voz Clara (Universal)';
      voiceSelect.appendChild(jsOpt2);
    }

    detectSpeechEngine();
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        const list = window.speechSynthesis.getVoices();
        if (list.length > 0) {
          hasNativeSpeech = true;
          populateVoices(list);
        }
      };
    }

    // Wake Lock para evitar bloqueo de pantalla en iOS
    wakeBtn.addEventListener('click', async () => {
      if (!('wakeLock' in navigator)) {
        wakeBtn.textContent = 'No disponible aquí';
        return;
      }
      try {
        if (wakeLock) {
          await wakeLock.release();
          wakeLock = null;
          wakeBtn.classList.remove('active');
          wakeDot.textContent = '○';
        } else {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeBtn.classList.add('active');
          wakeDot.textContent = '●';
          wakeLock.addEventListener('release', () => {
            wakeLock = null;
            wakeBtn.classList.remove('active');
            wakeDot.textContent = '○';
          });
        }
      } catch (err) {
        console.warn('WakeLock:', err);
      }
    });

    pdfInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      stopSpeech();
      currentPdfName = file.name.replace(/\.pdf$/i, '');
      fileNameEl.textContent = file.name;
      fileMetaEl.textContent = 'Extrayendo texto...';
      dropzone.style.display = 'none';
      fileBar.style.display = 'flex';

      try {
        const arrayBuffer = await file.arrayBuffer();
        pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        const total = pdfDoc.numPages;
        fileMetaEl.textContent = `${total} ${total === 1 ? 'página' : 'páginas'}`;

        pagesText = [];
        pageSelect.innerHTML = '';

        for (let p = 1; p <= total; p++) {
          const page = await pdfDoc.getPage(p);
          const content = await page.getTextContent();
          const rawText = content.items.map(item => item.str).join(' ');
          const cleanText = rawText.replace(/\s+/g, ' ').trim();
          pagesText.push(cleanText);

          const opt = document.createElement('option');
          opt.value = p;
          opt.textContent = `Página ${p}`;
          pageSelect.appendChild(opt);
        }

        settingsGrid.style.display = 'grid';
        readerBox.style.display = 'block';
        downloadCard.style.display = 'flex';
        playerDock.style.display = 'block';

        loadPage(1, false);
      } catch (err) {
        fileMetaEl.textContent = 'Error al leer el PDF';
        console.error(err);
      }
    });

    function splitIntoSentences(text) {
      if (!text) return ['(Página sin texto seleccionable)'];
      const matches = text.match(/[^.!?]+[.!?]+|[^.!?]+$/g);
      return matches ? matches.map(s => s.trim()).filter(Boolean) : [text];
    }

    function loadPage(pageNum, autoPlay = false) {
      stopSpeech();
      currentPage = pageNum;
      pageSelect.value = pageNum;
      pageIndicator.textContent = `Pág. ${pageNum}/${pagesText.length}`;

      sentences = splitIntoSentences(pagesText[pageNum - 1]);
      currentSentenceIdx = 0;

      readerBox.innerHTML = '';
      sentences.forEach((sentence, idx) => {
        const span = document.createElement('span');
        span.className = 'sentence';
        span.textContent = sentence + ' ';
        span.dataset.idx = idx;
        span.addEventListener('click', () => {
          stopSpeech();
          currentSentenceIdx = idx;
          startSpeech();
        });
        readerBox.appendChild(span);
      });

      updateProgressUI();
      if (autoPlay) startSpeech();
    }

    function updateProgressUI() {
      const total = sentences.length;
      sentenceCounter.textContent = `${Math.min(currentSentenceIdx + 1, total)} / ${total}`;
      const pct = total > 0 ? ((currentSentenceIdx) / total) * 100 : 0;
      progressFill.style.width = `${pct}%`;

      document.querySelectorAll('.sentence').forEach((el, idx) => {
        if (idx === currentSentenceIdx) {
          el.classList.add('active');
          el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } else {
          el.classList.remove('active');
        }
      });
    }

    // Síntesis por formantes en Web Audio API para entornos donde speechSynthesis esté bloqueado
    function playSentenceWithJS(text, pitchMode, onEnd) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!jsAudioCtx) jsAudioCtx = new AudioCtx();
      if (jsAudioCtx.state === 'suspended') jsAudioCtx.resume();

      const formants = {
        'a': [730, 1090, 2440],
        'e': [530, 1840, 2480],
        'i': [270, 2290, 3010],
        'o': [570, 840, 2410],
        'u': [300, 870, 2240]
      };

      const clean = text.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
      const chars = clean.split('');
      const baseFreq = pitchMode === 'clara' ? 195 : 122;
      const stepSec = Math.max(0.038, 0.068 / playbackRate);
      const totalDuration = Math.max(0.35, chars.length * stepSec);

      const now = jsAudioCtx.currentTime;
      const osc = jsAudioCtx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(baseFreq, now);

      const masterGain = jsAudioCtx.createGain();
      masterGain.gain.setValueAtTime(0.001, now);

      const f1 = jsAudioCtx.createBiquadFilter();
      const f2 = jsAudioCtx.createBiquadFilter();
      f1.type = 'bandpass'; f1.Q.value = 6;
      f2.type = 'bandpass'; f2.Q.value = 7;

      osc.connect(f1);
      osc.connect(f2);
      f1.connect(masterGain);
      f2.connect(masterGain);
      masterGain.connect(jsAudioCtx.destination);

      let lastVowel = 'a';
      chars.forEach((ch, idx) => {
        const t = now + idx * stepSec;
        if (formants[ch]) {
          lastVowel = ch;
          const [freq1, freq2] = formants[ch];
          f1.frequency.setTargetAtTime(freq1, t, 0.015);
          f2.frequency.setTargetAtTime(freq2, t, 0.015);
          osc.frequency.setTargetAtTime(baseFreq * (1 + (idx % 3) * 0.03), t, 0.02);
          masterGain.gain.setTargetAtTime(0.22, t, 0.015);
        } else if (ch === ' ' || ch === ',' || ch === '.') {
          masterGain.gain.setTargetAtTime(0.001, t, 0.015);
        } else {
          const [freq1, freq2] = formants[lastVowel];
          f1.frequency.setTargetAtTime(freq1 * 0.85, t, 0.015);
          f2.frequency.setTargetAtTime(freq2 * 1.1, t, 0.015);
          masterGain.gain.setTargetAtTime(0.11, t, 0.015);
        }
      });

      masterGain.gain.setTargetAtTime(0.0001, now + totalDuration, 0.02);
      osc.start(now);
      osc.stop(now + totalDuration + 0.08);
      jsActiveNodes.push(osc);

      jsPlaybackTimer = setTimeout(() => {
        jsActiveNodes = [];
        if (isPlaying && !isPaused) onEnd();
      }, (totalDuration + 0.12) * 1000);
    }

    function speakSentence(idx) {
      if (idx >= sentences.length) {
        if (currentPage < pagesText.length) {
          loadPage(currentPage + 1, true);
        } else {
          stopSpeech();
          progressFill.style.width = '100%';
        }
        return;
      }

      currentSentenceIdx = idx;
      updateProgressUI();

      const selectedVal = voiceSelect.value || 'js:grave';
      const text = sentences[idx];

      if (selectedVal.startsWith('native:') && hasNativeSpeech) {
        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          const vIdx = parseInt(selectedVal.split(':')[1], 10);
          if (nativeVoices[vIdx]) {
            utterance.voice = nativeVoices[vIdx];
            utterance.lang = nativeVoices[vIdx].lang;
          } else {
            utterance.lang = 'es-ES';
          }
          utterance.rate = playbackRate;

          let started = false;
          const fallbackGuard = setTimeout(() => {
            if (!started && isPlaying) {
              // El visor bloqueó silenciosamente la ejecución nativa: conmutar al motor JS
              hasNativeSpeech = false;
              populateVoices([]);
              playSentenceWithJS(text, 'grave', () => speakSentence(idx + 1));
            }
          }, 900);

          utterance.onstart = () => { started = true; clearTimeout(fallbackGuard); };
          utterance.onend = () => {
            clearTimeout(fallbackGuard);
            if (isPlaying && !isPaused) speakSentence(idx + 1);
          };
          utterance.onerror = () => {
            clearTimeout(fallbackGuard);
            if (isPlaying) {
              hasNativeSpeech = false;
              populateVoices([]);
              playSentenceWithJS(text, 'grave', () => speakSentence(idx + 1));
            }
          };

          window.speechSynthesis.speak(utterance);
          return;
        } catch (e) {
          hasNativeSpeech = false;
          populateVoices([]);
        }
      }

      const mode = selectedVal.includes('clara') ? 'clara' : 'grave';
      playSentenceWithJS(text, mode, () => speakSentence(idx + 1));
    }

    function startSpeech() {
      isPlaying = true;
      isPaused = false;
      updatePlayButtonUI();
      speakSentence(currentSentenceIdx);
    }

    function pauseSpeech() {
      isPaused = true;
      if ('speechSynthesis' in window) {
        try { window.speechSynthesis.pause(); } catch (e) {}
      }
      if (jsPlaybackTimer) clearTimeout(jsPlaybackTimer);
      jsActiveNodes.forEach(n => { try { n.stop(); } catch (e) {} });
      jsActiveNodes = [];
      updatePlayButtonUI();
    }

    function resumeSpeech() {
      isPaused = false;
      const selectedVal = voiceSelect.value || 'js:grave';
      if (selectedVal.startsWith('native:') && hasNativeSpeech && window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
      } else {
        speakSentence(currentSentenceIdx);
      }
      updatePlayButtonUI();
    }

    function stopSpeech() {
      isPlaying = false;
      isPaused = false;
      if ('speechSynthesis' in window) {
        try { window.speechSynthesis.cancel(); } catch (e) {}
      }
      if (jsPlaybackTimer) clearTimeout(jsPlaybackTimer);
      jsActiveNodes.forEach(n => { try { n.stop(); } catch (e) {} });
      jsActiveNodes = [];
      updatePlayButtonUI();
    }

    function updatePlayButtonUI() {
      if (isPlaying && !isPaused) {
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
      } else {
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
      }
    }

    playPauseBtn.addEventListener('click', () => {
      if (!pdfDoc) return;
      if (!isPlaying) {
        startSpeech();
      } else if (isPaused) {
        resumeSpeech();
      } else {
        pauseSpeech();
      }
    });

    prevPageBtn.addEventListener('click', () => {
      if (currentPage > 1) loadPage(currentPage - 1, isPlaying && !isPaused);
    });

    nextPageBtn.addEventListener('click', () => {
      if (currentPage < pagesText.length) loadPage(currentPage + 1, isPlaying && !isPaused);
    });

    pageSelect.addEventListener('change', (e) => {
      loadPage(parseInt(e.target.value, 10), isPlaying && !isPaused);
    });

    speedBtn.addEventListener('click', () => {
      speedIdx = (speedIdx + 1) % speeds.length;
      playbackRate = speeds[speedIdx];
      speedBtn.textContent = `${playbackRate}x`;
      if (isPlaying && !isPaused) {
        speakSentence(currentSentenceIdx);
      }
    });

    // Generación y descarga directa de archivo .WAV offline
    downloadBtn.addEventListener('click', async () => {
      if (!pdfDoc) return;
      downloadBtn.disabled = true;
      exportStatus.style.display = 'block';
      exportStatus.textContent = 'Renderizando pista de audio .WAV...';

      try {
        const textToRender = exportScope.value === 'all'
          ? pagesText.join('. ')
          : (pagesText[currentPage - 1] || '');

        const wavBlob = await renderTextToWav(textToRender);
        const url = URL.createObjectURL(wavBlob);
        const a = document.createElement('a');
        const suffix = exportScope.value === 'all' ? 'completo' : `pag-${currentPage}`;
        a.href = url;
        a.download = `${currentPdfName}-${suffix}.wav`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 5000);

        exportStatus.textContent = 'Archivo .WAV listo y descargado.';
      } catch (err) {
        console.error(err);
        exportStatus.textContent = 'No se pudo generar el archivo de audio.';
      } finally {
        downloadBtn.disabled = false;
      }
    });

    async function renderTextToWav(text) {
      const sampleRate = 22050;
      const clean = text.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
      const chars = clean.slice(0, 12000).split('');
      const stepSec = 0.055;
      const durationSec = Math.max(1.5, chars.length * stepSec + 0.5);
      const totalSamples = Math.floor(sampleRate * durationSec);

      const OfflineCtx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
      const offlineCtx = new OfflineCtx(1, totalSamples, sampleRate);

      const selectedVal = voiceSelect.value || 'js:grave';
      const baseFreq = selectedVal.includes('clara') ? 195 : 122;

      const osc = offlineCtx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(baseFreq, 0);

      const masterGain = offlineCtx.createGain();
      masterGain.gain.setValueAtTime(0.001, 0);

      const f1 = offlineCtx.createBiquadFilter();
      const f2 = offlineCtx.createBiquadFilter();
      f1.type = 'bandpass'; f1.Q.value = 6;
      f2.type = 'bandpass'; f2.Q.value = 7;

      const formants = {
        'a': [730, 1090],
        'e': [530, 1840],
        'i': [270, 2290],
        'o': [570, 840],
        'u': [300, 870]
      };

      let lastVowel = 'a';
      chars.forEach((ch, idx) => {
        const t = idx * stepSec;
        if (formants[ch]) {
          lastVowel = ch;
          f1.frequency.setValueAtTime(formants[ch][0], t);
          f2.frequency.setValueAtTime(formants[ch][1], t);
          masterGain.gain.setValueAtTime(0.24, t);
        } else if (ch === ' ' || ch === '.' || ch === ',') {
          masterGain.gain.setValueAtTime(0.002, t);
        } else {
          f1.frequency.setValueAtTime(formants[lastVowel][0] * 0.85, t);
          f2.frequency.setValueAtTime(formants[lastVowel][1] * 1.1, t);
          masterGain.gain.setValueAtTime(0.11, t);
        }
      });

      osc.connect(f1);
      osc.connect(f2);
      f1.connect(masterGain);
      f2.connect(masterGain);
      masterGain.connect(offlineCtx.destination);

      osc.start(0);
      osc.stop(durationSec);

      const renderedBuffer = await offlineCtx.startRendering();
      return audioBufferToWav(renderedBuffer);
    }

    function audioBufferToWav(buffer) {
      const numOfChan = buffer.numberOfChannels;
      const length = buffer.length * numOfChan * 2 + 44;
      const out = new ArrayBuffer(length);
      const view = new DataView(out);
      const channels = [];
      let sample = 0;
      let offset = 0;
      let pos = 0;

      function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
      function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }

      setUint32(0x46464952);
      setUint32(length - 8);
      setUint32(0x45564157);
      setUint32(0x20746d66);
      setUint32(16);
      setUint16(1);
      setUint16(numOfChan);
      setUint32(buffer.sampleRate);
      setUint32(buffer.sampleRate * 2 * numOfChan);
      setUint16(numOfChan * 2);
      setUint16(16);
      setUint32(0x61746164);
      setUint32(length - pos - 4);

      for (let i = 0; i < buffer.numberOfChannels; i++) {
        channels.push(buffer.getChannelData(i));
      }

      while (pos < length) {
        for (let i = 0; i < numOfChan; i++) {
          sample = Math.max(-1, Math.min(1, channels[i][offset]));
          sample = (sample < 0 ? sample * 32768 : sample * 32767) | 0;
          view.setInt16(pos, sample, true);
          pos += 2;
        }
        offset++;
      }

      return new Blob([out], { type: 'audio/wav' });
    }
  </script>
